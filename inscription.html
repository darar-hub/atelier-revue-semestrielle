<title>Inscription Atelier PEV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#122A3A; --ink-soft:#3F5566;
    --paper:#F4F6F5; --card:#FFFFFF; --line:#DCE3E2;
    --navy:#123A57; --navy-deep:#0B2740;
    --amber:#D98A2B; --green:#2E7D5B;
    --danger:#B3441E;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#EAF0EE; --ink-soft:#AEC0BC;
      --paper:#0E1B22; --card:#152531; --line:#274050;
      --navy:#8FC1E8; --navy-deep:#123A57;
      --amber:#E8A94E; --green:#67C79A; --danger:#E2896A;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --ink:#EAF0EE; --ink-soft:#AEC0BC;
    --paper:#0E1B22; --card:#152531; --line:#274050;
    --navy:#8FC1E8; --navy-deep:#123A57;
    --amber:#E8A94E; --green:#67C79A; --danger:#E2896A;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
    padding-inline:20px; padding-block:32px 56px;}
  h1,h2{font-family:"Fraunces",Georgia,serif; text-wrap:balance; margin:0}
  .wrap{max-width:520px; margin-inline:auto}
  .eyebrow{font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:var(--green); font-weight:600}
  h1{font-size:clamp(26px,6vw,32px); font-weight:600; color:var(--navy-deep); margin-top:8px}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) h1{color:var(--ink)}}
  :root[data-theme="dark"] h1{color:var(--ink)}
  .sub{font-size:14.5px; color:var(--ink-soft); margin-top:8px; line-height:1.5}
  form{margin-top:28px; display:flex; flex-direction:column; gap:16px}
  label{font-size:13px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:6px}
  input, select{
    width:100%; font:inherit; font-size:16px; padding:12px 14px;
    border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink);
  }
  input:focus, select:focus{outline:2px solid var(--green); outline-offset:1px}
  .req::after{content:" *"; color:var(--danger)}
  button{
    margin-top:6px; background:var(--navy); color:#fff; border:none; border-radius:10px;
    padding:14px 16px; font-size:16px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  button:hover{background:var(--navy-deep)}
  button:disabled{opacity:.6; cursor:progress}
  .err{font-size:12.5px; color:var(--danger); min-height:16px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px}
  .done{display:none; text-align:center; padding-block:40px 20px}
  .done .check{
    width:56px; height:56px; border-radius:50%; background:var(--green); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 16px;
  }
  .done h2{font-size:22px; color:var(--navy-deep)}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .done h2{color:var(--ink)}}
  :root[data-theme="dark"] .done h2{color:var(--ink)}
  .done p{font-size:14px; color:var(--ink-soft); margin-top:8px}
  .badge{display:inline-block; margin-top:14px; font-size:12.5px; font-weight:600; color:var(--navy); background:var(--line); padding:5px 10px; border-radius:7px}
  footer{margin-top:22px; font-size:11.5px; color:var(--ink-soft); text-align:center}
</style>

<div class="wrap">
  <span class="eyebrow">PEV Djibouti &middot; Atelier de revue semestrielle</span>
  <h1>Inscription &agrave; la conf&eacute;rence</h1>
  <p class="sub">Djibouti ville &middot; 30 septembre &ndash; 1<sup>er</sup> octobre 2026. Merci de vous enregistrer avant le d&eacute;but de la s&eacute;ance plani&egrave;re.</p>

  <div class="card" id="formCard">
    <form id="regForm">
      <div>
        <label class="req" for="nom">Nom et pr&eacute;nom</label>
        <input id="nom" name="nom" autocomplete="name" required>
      </div>
      <div>
        <label class="req" for="email">Email</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="nom@exemple.com" required>
      </div>
      <div>
        <label class="req" for="fonction">Fonction</label>
        <input id="fonction" name="fonction" placeholder="Ex. Point focal surveillance, m&eacute;decin, consultant..." required>
      </div>
      <div>
        <label class="req" for="structure">Structure d'affiliation</label>
        <select id="structure" name="structure" required>
          <option value="" disabled selected>S&eacute;lectionner...</option>
          <option>Minist&egrave;re de la Sant&eacute;</option>
          <option>OMS</option>
          <option>Unicef</option>
          <option value="Autre">Autre (&agrave; pr&eacute;ciser)</option>
        </select>
        <select id="structureMS" name="structureMS" style="margin-top:8px; display:none">
          <option value="" disabled selected>Pr&eacute;ciser (Minist&egrave;re de la Sant&eacute;)...</option>
          <option>PEV</option>
          <option>INSPD</option>
          <option>DGOS</option>
          <option value="Autre">Autres (&agrave; pr&eacute;ciser)</option>
        </select>
        <input id="structureMSAutre" name="structureMSAutre" style="margin-top:8px; display:none" placeholder="Pr&eacute;cisez (Minist&egrave;re de la Sant&eacute;)">
        <input id="structureAutre" name="structureAutre" style="margin-top:8px; display:none" placeholder="Pr&eacute;cisez la structure">
      </div>
      <div>
        <label class="req" for="groupe">R&eacute;gion</label>
        <select id="groupe" name="groupe" required>
          <option value="" disabled selected>S&eacute;lectionner...</option>
          <option>Djibouti ville</option>
          <option>Ali Sabieh</option>
          <option>Arta</option>
          <option>Dikhil</option>
          <option>Tadjourah</option>
          <option>Obock</option>
        </select>
      </div>
      <div>
        <label class="req" for="whatsapp">Num&eacute;ro de t&eacute;l&eacute;phone WhatsApp</label>
        <input id="whatsapp" name="whatsapp" type="tel" inputmode="tel" autocomplete="tel" placeholder="+253 77 xx xx xx" required>
      </div>
      <div class="err" id="errMsg"></div>
      <button type="submit" id="submitBtn">S'enregistrer</button>
    </form>
  </div>

  <script>
    (function(){
      var sel = document.getElementById('structure');
      var autre = document.getElementById('structureAutre');
      var ms = document.getElementById('structureMS');
      var msAutre = document.getElementById('structureMSAutre');

      function show(el, on, req){
        el.style.display = on ? 'block' : 'none';
        if (req){
          if (on) el.setAttribute('required','required');
          else { el.removeAttribute('required'); el.value = ''; }
        } else if (!on){
          el.value = '';
        }
      }

      sel.addEventListener('change', function(){
        show(autre, sel.value === 'Autre', true);
        show(ms, sel.value === 'Ministère de la Santé', true);
        if (sel.value !== 'Ministère de la Santé'){ show(msAutre, false, true); }
      });
      ms.addEventListener('change', function(){
        show(msAutre, ms.value === 'Autre', true);
      });
    })();
  </script>

  <div class="card done" id="doneCard">
    <div class="check">&#10003;</div>
    <h2>Inscription enregistr&eacute;e</h2>
    <p id="doneText"></p>
    <span class="badge" id="doneBadge"></span>
  </div>

  <footer>Programme &Eacute;largi de Vaccination &mdash; R&eacute;publique de Djibouti</footer>
</div>

<script>
(function(){
  var form = document.getElementById('regForm');
  var formCard = document.getElementById('formCard');
  var doneCard = document.getElementById('doneCard');
  var doneText = document.getElementById('doneText');
  var doneBadge = document.getElementById('doneBadge');
  var errMsg = document.getElementById('errMsg');
  var submitBtn = document.getElementById('submitBtn');

  var DEST_EMAIL = 'hyusef@gmail.com';

  form.addEventListener('submit', function(e){
    e.preventDefault();
    errMsg.textContent = '';
    var nom = document.getElementById('nom').value.trim();
    var email = document.getElementById('email').value.trim();
    var fonction = document.getElementById('fonction').value.trim();
    var structureSel = document.getElementById('structure').value;
    var structureAutre = document.getElementById('structureAutre').value.trim();
    var structureMS = document.getElementById('structureMS').value;
    var structureMSAutre = document.getElementById('structureMSAutre').value.trim();
    var groupe = document.getElementById('groupe').value;
    var whatsapp = document.getElementById('whatsapp').value.trim();

    var isMS = (structureSel === 'Ministère de la Santé');
    var structure = structureSel;
    if (structureSel === 'Autre'){
      structure = structureAutre;
    } else if (isMS){
      var msDetail = (structureMS === 'Autre') ? structureMSAutre : structureMS;
      structure = structureSel + (msDetail ? ' – ' + msDetail : '');
    }

    if (!nom || !email || !fonction || !structureSel || !groupe || !whatsapp){
      errMsg.textContent = 'Merci de remplir les champs obligatoires.';
      return;
    }
    if (structureSel === 'Autre' && !structureAutre){
      errMsg.textContent = "Merci de préciser la structure d'affiliation.";
      return;
    }
    if (isMS && !structureMS){
      errMsg.textContent = "Merci de préciser (PEV, INSPD, DGOS ou autres).";
      return;
    }
    if (isMS && structureMS === 'Autre' && !structureMSAutre){
      errMsg.textContent = "Merci de préciser la structure (Ministère de la Santé).";
      return;
    }
    if (email.indexOf('@') === -1 || email.indexOf('.') === -1){
      errMsg.textContent = 'Merci de saisir une adresse email valide.';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Ouverture de votre messagerie…';

    var lignes = [
      'Nom et prénom : ' + nom,
      'Email : ' + email,
      'Fonction : ' + fonction,
      "Structure d'affiliation : " + structure,
      'Région : ' + groupe,
      'WhatsApp : ' + whatsapp
    ];
    var subject = 'Inscription Atelier PEV - ' + nom;
    var body = lignes.join('\n');
    var mailtoUrl = 'mailto:' + encodeURIComponent(DEST_EMAIL) +
      '?subject=' + encodeURIComponent(subject) +
      '&body=' + encodeURIComponent(body);

    window.location.href = mailtoUrl;

    formCard.style.display = 'none';
    doneCard.style.display = 'block';
    doneText.textContent = 'Bienvenue, ' + nom + '. Votre application de messagerie va s\'ouvrir avec vos informations pré-remplies : il ne reste qu\'à appuyer sur Envoyer pour valider votre inscription.';
    doneBadge.textContent = groupe;

    setTimeout(function(){
      submitBtn.disabled = false;
      submitBtn.textContent = "S'enregistrer";
    }, 1500);
  });
})();
</script>
